[workspace]
resolver = "2"
license = "Apache-2.0"
repository = "https://github.com/mnemo/mnemo"
members = [
    "crates/mnemo-core",
    "crates/mnemo-parser",
    "crates/mnemo-store",
    "crates/mnemo-graph",
    "crates/mnemo-git",
    "crates/mnemo-resolve",
    "crates/mnemo-index",
    "crates/mnemo-tenant",
    "crates/mnemo-daemon",
    "crates/mnemo-mcp",
    "crates/mnemo-memory",
    "crates/mnemo-cli",
    "tests/invariants",
]

[workspace.dependencies]
# Async runtime (only for MCP transport / filesystem watching)
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
thiserror = "2"
anyhow = "1"
# Structured logging / spans
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Embedded SQLite
rusqlite = { version = "0.32", features = ["bundled"] }
# Tree-sitter (runtime 0.25 matches the ABI-15 grammars below)
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
# Git bindings
git2 = "0.19"
# UUID generation
uuid = { version = "1", features = ["v4"] }
# Content hashing
blake3 = "1"
# Hex encoding for ID display
hex = "0.4"
# MCP protocol (Rust). macros = #[tool] etc.; transport-io = stdio server.
rmcp = { version = "0.7", features = ["server", "macros", "transport-io"] }
# JSON Schema for MCP tool definitions (must match rmcp 0.7's schemars 1.0)
schemars = "1"
# Timestamps
chrono = { version = "0.4", features = ["serde"] }
# CLI argument parsing
clap = { version = "4", features = ["derive"] }
# Directory walking
walkdir = "2"
# Home directory resolution
dirs = "5"
# Temp dirs for tests
tempfile = "3"
# Multi-tenant daemon (M2): concurrent map, lock-free graph swap, LRU, fast mutex
dashmap = "6"
arc-swap = "1"
lru = "0.12"
parking_lot = "0.12"
# Cross-platform local IPC (Unix domain socket / Windows named pipe)
interprocess = { version = "2", features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
