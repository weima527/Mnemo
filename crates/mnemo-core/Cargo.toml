[package]
name = "mnemo-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Domain types, errors, and traits for the Mnemo code intelligence layer"

[features]
default = ["git", "sqlite"]
git = ["dep:git2"]
sqlite = ["dep:rusqlite"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
git2 = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
