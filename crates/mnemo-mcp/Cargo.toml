[package]
name = "mnemo-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "MCP stdio bridge for Mnemo: forwards tool calls to the local daemon"

[dependencies]
mnemo-daemon = { path = "../mnemo-daemon" }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
mnemo-tenant = { path = "../mnemo-tenant" }
tempfile = { workspace = true }
